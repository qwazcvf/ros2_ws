nano_base_bridge_node:
  ros__parameters:
    # -------------------------
    # Mode
    # -------------------------
    simulation_mode: true
    hardware_transport: "serial"

    # -------------------------
    # ROS topics
    # -------------------------
    cmd_vel_topic: "/cmd_vel"
    odom_topic: "/odom"
    status_topic: "/base/status"

    # -------------------------
    # Coordinate frames
    # -------------------------
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    publish_tf: true

    # -------------------------
    # Control frequencies
    # -------------------------
    control_rate_hz: 50.0
    status_rate_hz: 5.0

    # -------------------------
    # Vehicle geometry parameters
    # Adjust to match actual chassis later
    # -------------------------
    wheel_base_m: 0.55
    track_width_m: 0.45
    wheel_radius_m: 0.08

    # -------------------------
    # Phase 1 conservative speed limits
    # Defaults MUST be safe
    # -------------------------
    max_speed_mps: 0.10
    max_reverse_speed_mps: 0.05
    max_angular_speed_radps: 0.50
    max_steering_angle_rad: 0.35

    # -------------------------
    # Deadbands
    # -------------------------
    linear_deadband_mps: 0.02
    angular_deadband_radps: 0.03

    # -------------------------
    # Ackermann conversion
    # -------------------------
    min_speed_for_ackermann_mps: 0.05

    allow_stationary_steering: false

    allow_pure_angular_crawl: false
    pure_angular_crawl_speed_mps: 0.00

    # -------------------------
    # Safety mechanisms
    # -------------------------
    cmd_vel_timeout_sec: 0.5
    hardware_feedback_timeout_sec: 0.5
    communication_timeout_sec: 0.5
    send_stop_on_startup: true
    send_stop_on_shutdown: true
    stop_on_estop: true

    # -------------------------
    # Battery (reserved)
    # -------------------------
    battery_warn_voltage: 21.0
    battery_stop_voltage: 19.0
    enable_low_voltage_stop: false

    # -------------------------
    # Serial (reserved)
    # colcon build MUST NOT fail without pyserial
    # -------------------------
    serial_port: "/dev/ttyUSB0"
    serial_baudrate: 115200
    serial_timeout_sec: 0.05

    # -------------------------
    # CAN (reserved)
    # colcon build MUST NOT fail without python-can or can0
    # -------------------------
    can_interface: "can0"
    can_bitrate: 500000

    # -------------------------
    # Direction compatibility
    # If real-vehicle direction is reversed, change params, NOT code
    # -------------------------
    invert_speed: false
    invert_steering: false

    # -------------------------
    # Odom covariance
    # Phase 1 conservative values
    # -------------------------
    odom_pose_covariance_diagonal: [0.05, 0.05, 9999.0, 9999.0, 9999.0, 0.20]
    odom_twist_covariance_diagonal: [0.05, 0.05, 9999.0, 9999.0, 9999.0, 0.20]
