# Phase 2A — Front-steering Ackermann-like controllers
#
#  joint_state_broadcaster — publishes /joint_states
#  front_steering_controller — position control for fl/fr steering only
#  drive_controller — velocity control for all 4 wheels
#
#  Rear steering is NOT exposed to controllers (Phase 2A).
#  Controller manager runs inside Gazebo (no standalone ros2_control_node).

controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    front_steering_controller:
      type: position_controllers/JointGroupPositionController

    drive_controller:
      type: velocity_controllers/JointGroupVelocityController

# Front steering: fl + fr only (rear locked)
front_steering_controller:
  ros__parameters:
    joints:
      - fl_steering_joint
      - fr_steering_joint

# Drive: all 4 wheels
drive_controller:
  ros__parameters:
    joints:
      - fl_wheel_joint
      - fr_wheel_joint
      - rl_wheel_joint
      - rr_wheel_joint
