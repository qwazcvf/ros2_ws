# ==========================================================================
#  Inspection Bot — ros2_control configuration (Ignition Gazebo Fortress)
#
#  3 controllers:
#    1. joint_state_broadcaster — publishes /joint_states
#    2. steering_controller    — position control for 4 steering servos
#    3. drive_controller       — velocity control for 4 wheel motors
#
#  The controller_manager runs INSIDE Gazebo (loaded by the system plugin).
#  No standalone ros2_control_node is needed.
# ==========================================================================

controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    steering_controller:
      type: position_controllers/JointGroupPositionController

    drive_controller:
      type: velocity_controllers/JointGroupVelocityController

# --- Steering controller: 4 position-controlled joints (rad) ---
steering_controller:
  ros__parameters:
    joints:
      - fl_steering_joint
      - fr_steering_joint
      - rl_steering_joint
      - rr_steering_joint

# --- Drive controller: 4 velocity-controlled joints (rad/s) ---
drive_controller:
  ros__parameters:
    joints:
      - fl_wheel_joint
      - fr_wheel_joint
      - rl_wheel_joint
      - rr_wheel_joint
